<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f97316" />
    <title>You're offline - Flash Go Delivery</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #fff7ed;
        color: #1f2937;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem 1.5rem;
        text-align: center;
      }
      img.logo {
        height: 48px;
        width: auto;
        object-fit: contain;
      }
      .icon {
        font-size: 3rem;
        line-height: 1;
      }
      h1 {
        margin: 0;
        font-size: 1.375rem;
        font-weight: 600;
        color: #111827;
      }
      p {
        margin: 0;
        max-width: 22rem;
        font-size: 0.9375rem;
        color: #6b7280;
      }
      button {
        margin-top: 0.5rem;
        border: 0;
        border-radius: 0.75rem;
        background: #f97316;
        color: #fff;
        font-size: 0.9375rem;
        font-weight: 600;
        padding: 0.75rem 1.75rem;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(249, 115, 22, 0.35);
      }
      button:hover {
        background: #ea6a0f;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <img class="logo" src="/flashlogo.png" alt="FlashGo" />
      <div class="icon" aria-hidden="true">📡</div>
      <h1>You're offline</h1>
      <p>
        We can't reach Flash Go Delivery right now. Check your connection and
        try again — anything you already opened will keep working from cache.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
